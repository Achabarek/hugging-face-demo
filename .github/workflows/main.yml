name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face
        env:
          HF: ${{ secrets.HF }}
        run: |
          git push --force \
            https://cooper-60609:$HF@huggingface.co/spaces/cooper-60609/demo \
            HEAD:main
